<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>PreferenceRank</title>
		<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — PreferenceRank
		   720px: a single column of pairwise choices. The two battle buttons are
		   deliberately large touch targets and stack on phones.
		   ===================================================================== */
		:root {
			--content-max: 720px;
		}

		textarea { font-family: var(--font-mono); min-height: 8rem; }

		.count { font-size: .8125rem; margin-top: var(--sp-1); text-align: right; color: var(--text-muted); }
		.error { color: var(--danger); font-size: .875rem; margin-top: var(--sp-2); display: block; }

		.row { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-3) 0; }
		.row input { width: auto; }
		.row label { margin: 0; font-weight: 400; }

		.actions { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-4); }

		/* Head-to-head battle buttons */
		#battle, #tieWrap, #restartWrap { display: flex; gap: var(--sp-4); }
		#battle button, #tieWrap button {
			flex: 1;
			font-size: 1.125rem;
			min-height: 110px;
			white-space: normal;
		}
		#restartWrap button { flex: 1; }

		#progress { font-size: 1rem; margin-top: var(--sp-4); text-align: center; color: var(--text-muted); }
		.track {
			background: var(--muted);
			border-radius: var(--radius-pill);
			height: 6px;
			margin: var(--sp-2) auto var(--sp-4);
			overflow: hidden;
			max-width: 480px;
		}
		.fill { background: var(--primary); height: 100%; width: 0; transition: width .2s; }

		#cancel, #toggle {
			background: transparent;
			border: 1px solid var(--border);
			color: var(--text);
			width: 100%;
			margin-top: var(--sp-2);
		}
		#cancel:hover { background: var(--surface-variant); }
		#cancel.confirming { border-color: var(--danger); color: var(--danger); }
		#toggle { border-color: transparent; color: var(--primary); text-decoration: underline; }

		#tips {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-4);
			margin-top: var(--sp-3);
			font-size: .875rem;
			line-height: 1.7;
		}
		kbd {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: 1px 5px;
			font-family: var(--font-mono);
			font-size: .8em;
		}

		/* Results header with undo/copy on either side of the title */
		.header {
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			min-height: var(--control-h);
			margin-bottom: var(--sp-4);
			gap: var(--sp-2);
		}
		.header #undo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
		.header #copy { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
		#undo, #copy { width: auto; }

		.filter-wrap { margin-bottom: var(--sp-3); text-align: right; }
		#resultFilter { width: 220px; max-width: 100%; }

		/* Leaderboard */
		.leaderboard {
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: var(--surface);
			overflow: hidden;
		}
		.lb-header {
			display: flex;
			padding: var(--sp-3) var(--sp-4);
			background: var(--surface-variant);
			border-bottom: 1px solid var(--border);
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
		}
		.lb-header > div { cursor: pointer; user-select: none; display: flex; align-items: center; gap: var(--sp-2); }
		.lb-header > div:hover { color: var(--primary); }
		.lb-header .lb-col-grade, .lb-header .lb-col-score { justify-content: flex-end; }
		.lb-row { border-bottom: 1px solid var(--border); }
		.lb-row:last-child { border-bottom: none; }
		.lb-main {
			display: flex;
			padding: var(--sp-3) var(--sp-4);
			align-items: center;
			cursor: pointer;
			background: var(--surface);
		}
		.lb-main:hover { background: var(--muted); }
		.lb-col-rank { flex: 0 0 90px; display: flex; align-items: center; gap: var(--sp-1); font-weight: 600; }
		.lb-col-item { flex: 1; font-weight: 500; min-width: 0; }
		.lb-col-grade { flex: 0 0 80px; text-align: right; }
		.lb-col-score { flex: 0 0 90px; text-align: right; font-variant-numeric: tabular-nums; }
		.lb-details {
			display: none;
			background: var(--surface-variant);
			padding: var(--sp-4);
			border-top: 1px solid var(--border);
		}
		.lb-row.expanded .lb-details { display: block; }
		.lb-row.expanded .chevron { transform: rotate(90deg); }
		.chevron { display: inline-block; transition: transform .2s; font-size: .8rem; color: var(--text-muted); }

		.detail-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
			gap: var(--sp-4);
		}
		.detail-item { display: flex; flex-direction: column; gap: var(--sp-1); }
		.detail-label { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
		.detail-value { font-size: 1.0625rem; font-weight: 500; }
		.ci-badge { color: var(--text-muted); font-size: .85rem; margin-left: 4px; }

		.spread-track { background: var(--muted); border-radius: 2px; height: 4px; margin-top: 4px; position: relative; overflow: hidden; }
		.spread-bar { background: var(--primary); height: 100%; min-width: 2px; position: absolute; border-radius: 2px; }

		.selected { background: var(--primary) !important; color: var(--on-primary) !important; }

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}

		/* #undo is re-parented into .app-main during a battle; keep it compact */
		.app-main > #undo,
		.app-main > #copy { align-self: flex-start; }

		/* Session-restore modal */
		#sessionModal {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			-webkit-backdrop-filter: blur(2px);
			backdrop-filter: blur(2px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 200;
			padding: var(--sp-4);
			animation: fadeIn .15s ease;
		}
		.session-card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-6);
			box-shadow: var(--shadow-2);
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			gap: var(--sp-3);
			max-width: 420px;
			width: 100%;
		}
		.session-icon {
			width: 4rem;
			height: 4rem;
			border-radius: 50%;
			background: var(--highlight-bg);
			color: var(--primary);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2rem;
		}
		#sessionTitle { font-size: 1.25rem; }
		#sessionMessage { color: var(--text-muted); }
		#sessionButtons { display: flex; gap: var(--sp-3); width: 100%; }
		#sessionButtons button { flex: 1; }

		@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

		@media (max-width: 600px) {
			#battle, #tieWrap, #restartWrap { flex-direction: column; }
			.lb-col-rank { flex: 0 0 64px; }
			.lb-col-grade { flex: 0 0 56px; }
			.lb-col-score { flex: 0 0 70px; }
		}

		/* Rules unique to this app that have no equivalent in the core.
		   Anything here that turns out to be reusable belongs in core.css. */
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .lb-main:focus-visible, .lb-header > div:focus-visible {
				outline: 2px solid var(--primary); 
				outline-offset: 2px; 
			} 
 
			.primary { 
				background: var(--primary); 
				border: none; 
				color: var(--on-primary); 
			} 
 
			.primary:hover:not(:disabled) { 
				background: var(--hover); 
			} 
 
			#results { 
				overflow: visible;
			} 
 
			.lb-row:last-child .lb-main, .lb-row:last-child.expanded .lb-details { 
				border-bottom-left-radius: 8px; 
				border-bottom-right-radius: 8px; 
			} 
 
			@keyframes fadeIn { 
				from { opacity: 0; } 
				to   { opacity: 1; } 
			}
	</style>
	</head>
	<body>
	<header class="app-header">
		<div class="app-title-group">
			<h1 id="title"></h1>
		</div>
		<div class="app-controls">
			<button id="settingsBtn" class="btn-icon" type="button" aria-label="Settings" title="Settings">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="12" cy="12" r="3"></circle>
					<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
				</svg>
			</button>
		</div>
	</header>

	<main class="app-main" id="container">
			<div id="sessionModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="sessionTitle" aria-describedby="sessionMessage">
				<div class="session-card">

					<label for="allowTies" id="labelTies"></label>

	</main>
	<dialog id="settingsDialog" class="sheet" aria-labelledby="prefTitle">
		<form method="dialog">
			<div class="sheet-header">
				<h2 id="prefTitle"></h2>
				<button class="btn-icon" value="close" aria-label="Close settings">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
						<path d="M18 6 6 18M6 6l12 12"></path>

					<label id="langLabel" for="language"></label>
					<select id="language" aria-label="Language"><option value="en">English</option><option value="id">Bahasa Indonesia</option></select>
				</div>
				<div class="field">
					<label id="themeLabel" for="theme"></label>
					<select id="theme" aria-label="Theme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select>

	</dialog>
	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';

					elements.showGradeRow.classList.remove('hidden');
					const arrow = this.sortState.direction === 'asc' ? ' ▲' : ' ▼';
					const getSortIcon = col=>this.sortState.column === col ? arrow : '';
					const getSortState = col=>this.sortState.column === col ? (this.sortState.direction === 'asc' ? 'ascending' : 'descending') : 'none';
					const lb = document.createElement('div');
					lb.className = 'leaderboard';
					lb.setAttribute('role', 'table');
					lb.innerHTML = `
					<div class="lb-header" role="row">
						<div class="lb-col-rank" role="columnheader" tabindex="0" aria-sort="${getSortState('rank')}" data-sort="rank">${this.string('rank')}${getSortIcon('rank')}</div>
						<div class="lb-col-item" role="columnheader" tabindex="0" aria-sort="${getSortState('item')}" data-sort="item">${this.string('item')}${getSortIcon('item')}</div>
						${this.showGrade ? `<div class="lb-col-grade" role="columnheader" tabindex="0" aria-sort="${getSortState('grade')}" data-sort="grade">${this.string('grade')}${getSortIcon('grade')}</div>` : ''}
						<div class="lb-col-score" role="columnheader" tabindex="0" aria-sort="${getSortState('score')}" data-sort="score">${this.string('score')}${getSortIcon('score')}</div>
					</div>
					<div class="lb-body" role="rowgroup"></div>`;
					const body = lb.querySelector('.lb-body');
					const hasStats = this.stats && this.stats.spreads;
					const itemMatches = Array(this.items.length).fill(0);
					this.matches.forEach(m=>{
						itemMatches[m.a]++;
						itemMatches[m.b]++;
					}
					);
					ranking.forEach(x=>{
						const row = document.createElement('div');
						row.className = 'lb-row';
						const rank = ranks[x];
						const item = this.items[x];
						const score = Math.round(this.scores[x]);
						const ci = hasStats ? Math.round(this.stats.cis[x]) : null;
						const spread = hasStats ? `${this.stats.spreads[x][0]} — ${this.stats.spreads[x][1]}` : null;
						let spreadBar = '';
						if (hasStats) {
							const [min,max] = this.stats.spreads[x];
							const total = this.items.length;
							const pMin = total > 1 ? ((min - 1) / (total - 1)) * 100 : 0;
							const pWidth = total > 1 ? ((max - min) / (total - 1)) * 100 : 100;
							spreadBar = `<div class="spread-track" title="${spread}"><div class="spread-bar" style="left:${pMin}%;width:${pWidth}%"></div></div>`;
						}
						row.innerHTML = `
						<div class="lb-main" role="button" tabindex="0" aria-expanded="false">
							<div class="lb-col-rank"><span class="chevron" aria-hidden="true">&#x203a;</span><span>${rank}</span></div>
							<div class="lb-col-item"></div>
							${this.showGrade ? `<div class="lb-col-grade">${this.getGrade(score)}</div>` : ''}
							<div class="lb-col-score">${score}${ci !== null ? `<span class="ci-badge">±${ci}</span>` : ''}</div>
						</div>
						<div class="lb-details">
							<div class="detail-grid">
								${spread ? `<div class="detail-item"><span class="detail-label">${this.string('rankSpread')}</span><span class="detail-value">${spread}</span>${spreadBar}</div>` : ''}
								<div class="detail-item"><span class="detail-label">${this.string('matches')}</span><span class="detail-value">${itemMatches[x]}</span></div>
							</div>
						</div>`;
						row.querySelector('.lb-col-item').textContent = item;
						const main = row.querySelector('.lb-main');
						const toggle = ()=>{
							const isExpanded = row.classList.toggle('expanded');
							main.setAttribute('aria-expanded', isExpanded);
						};
						main.onclick = toggle;
						main.onkeydown = e=>{
							if (e.key === 'Enter' || e.key === ' ') {
								e.preventDefault();
								toggle();
							}
						}
						;
						body.appendChild(row);
					}
					);
					elements.results.appendChild(lb);
					elements.resultFilter = document.getElementById('resultFilter');
					elements.resultFilter.oninput = e=>this.filterResults(e.target.value);
					if (this.filterTerm)
						this.filterResults(this.filterTerm);
					this.display('results', preventFocus);
					elements.announcer.textContent = this.string('resultsReady');
					this.save();
				}
				display(section, preventFocus) {
					document.body.classList.toggle('results-mode', section === 'results');
					elements.container.classList.toggle('input-mode', section === 'inputSection');
					['inputSection', 'battleSection', 'results'].forEach(id=>elements[id].classList.toggle('hidden', id !== section));
					elements.restartWrap.classList.toggle('hidden', section !== 'results');
					elements.undo.classList.toggle('hidden', section === 'inputSection');
					elements.copy.classList.toggle('hidden', section !== 'results');
					elements.showGradeRow.classList.toggle('hidden', section !== 'results');
					if (section !== 'results')
						elements.results.parentElement.appendChild(elements.showGradeRow);
					if (section === 'battleSection')
						elements.battleSection.before(elements.undo);
					if (section === 'results') {
						elements.results.firstChild.prepend(elements.undo);
						elements.results.firstChild.appendChild(elements.copy);
					}
					if (section === 'inputSection')
						this.updateInputState();
					const focusTarget = {
						battleSection: elements.left,
						inputSection: elements.items
					}[section];
					if (focusTarget && !preventFocus)
						setTimeout(()=>focusTarget.focus(), 50);
				}
				copyResults() {
					const baseRanking = [...this.scores.keys()].sort((a,b)=>this.scores[b] - this.scores[a]);
					const ranks = [];
					baseRanking.forEach((x,i)=>ranks[x] = i + 1);
					const ranking = this.currentRanking || baseRanking;
					const hasStats = this.stats && this.stats.spreads;
					const headers = [
						'rank',
						hasStats && 'rankSpread',
						'item',
						this.showGrade && 'grade',
						'score',
						hasStats && 'ci'
					].filter(Boolean).map(k => this.string(k)).join('\t');
					const lines = ranking.map(x=>{
						const score = Math.round(this.scores[x]);
						const row = [ranks[x]];
						if (hasStats)
							row.push(`${this.stats.spreads[x][0]}—${this.stats.spreads[x][1]}`);
						row.push(this.items[x]);
						if (this.showGrade)
							row.push(this.getGrade(score));
						row.push(score);
						if (hasStats)
							row.push(`±${Math.round(this.stats.cis[x])}`);
						return row.join('\t');
					}
					);
					navigator.clipboard.writeText([headers, ...lines].join('\n')).then(()=>{
						clearTimeout(this.copyTimeout);
						elements.copy.textContent = this.string('copied');
						elements.announcer.textContent = `${this.string('resultsTitle')} ${this.string('copied')}`;
						this.copyTimeout = setTimeout(()=>elements.copy.textContent = this.string('copy'), 2e3);
					}
					);
				}
				cancel() {
					const reset = ()=>{
						elements.cancel.classList.remove('confirming');
						elements.cancel.textContent = this.string('cancel');
						this.cancelTimeout = null;
					}
					;
					this.cancelTimeout ? (clearTimeout(this.cancelTimeout),
					reset(),
					this.display('inputSection')) : (elements.cancel.textContent = this.string('confirmCancel'),
					elements.cancel.classList.add('confirming'),
					this.cancelTimeout = setTimeout(reset, 3000));
				}
				undo() {
					if (!this.busy && this.history.length) {
						const last = this.history.pop();
						while (this.matches.length > last.step) this.matches.pop();
						this.dirty = true;
						this._rebuildReach();

						Object.assign(this, {
							step: last.step,
							pair: last.pair,
							swapped: last.swapped
						});
						this.provider.restore(last.state, this.matches);
						this.render();
						this.display('battleSection');
						elements.undo.disabled = !this.history.length;
						this.save();
					}
				}
				reset() {
					Object.assign(this, {
						scores: [],
						matches: [],
						history: [],
						provider: null,
						dirty: true
					});
					this.display('inputSection');
					this.updateHelp();
					this.updateProgress();
					this.save();
				}
				key(event) {
					if (event.repeat)
						return;
					const {key, ctrlKey, metaKey, shiftKey} = event;
					const isModifier = ctrlKey || metaKey;
					const isInputVisible = !elements.inputSection.classList.contains('hidden');
					const isStartEnabled = !elements.start.disabled;
					if (key === 'Enter' && isModifier && isInputVisible && isStartEnabled) {
						event.preventDefault();
						elements.start.click();
						return;
					}
					const action = {
						arrowleft: 'left',
						arrowright: 'right',
						arrowup: 'tie',
						arrowdown: 'tie',
						z: 'undo',
						'?': 'toggle',
						'/': 'toggle'
					}[key.toLowerCase()];
					if (!action || isInputVisible || /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName))
						return;
					const isBattleVisible = !elements.battleSection.classList.contains('hidden');
					const isTieAllowed = action !== 'tie' || this.allowTies;
					if (action === 'undo' && isModifier && !shiftKey) {
						event.preventDefault();
						elements.undo.click();
					}
					if (action !== 'undo' && isBattleVisible && isTieAllowed) {
						event.preventDefault();
						elements[action].click();
						document.activeElement?.blur();
					}
				}
			}
			window.app = new PreferenceRank();
		</script>
</body>
</html>
